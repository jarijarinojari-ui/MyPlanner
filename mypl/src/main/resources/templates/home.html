<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/appearance.js"></script><script src="/i18n.js" defer></script><title>마이플래너 · 오늘의 기록</title><link rel="stylesheet" href="/planner.css"><link rel="stylesheet" href="/planner-layout.css"><script src="/planner.js" defer></script><script src="/weekly.js" defer></script><link rel="stylesheet" href="/preferences.css"></head>
<body><header><a class="brand" href="/">my planner<span>나의 속도로 채우는 하루</span></a><a href="/logout">로그아웃</a><div class="preferences" aria-label="화면 설정"><select id="language-setting" aria-label="언어"><option value="ko">한국어</option><option value="ja">日本語</option><option value="en">English</option></select><button id="theme-setting" type="button" aria-label="다크 모드" aria-pressed="false">☾</button></div></header>
<nav class="panel-tabs" aria-label="플래너 화면"><button id="show-schedule" aria-pressed="true">주간 · 월간</button><button id="show-daily" aria-pressed="false">일간</button></nav><main><aside class="paper schedule">
<div class="schedule-title"><p class="eyebrow">MY SCHEDULE</p><button id="toggle-view" aria-pressed="false">월간으로 변경</button></div>
<div id="weekly-view">
<div class="month-nav"><button id="prev-week" aria-label="이전 주">←</button><h2 id="week-label"></h2><button id="next-week" aria-label="다음 주">→</button></div>
<p class="hint">시간 선택 → 내용 입력 → 추가 · 다시 누르면 취소</p>
<form id="week-draft" hidden aria-label="선택한 시간에 일정 추가"><span id="week-draft-time"></span><input id="week-draft-memo" placeholder="무엇을 했나요?" aria-label="일정 내용, 최대 20자" autocomplete="off"><button id="confirm-week-draft" type="submit">추가</button><button id="cancel-week-draft" type="button">취소</button></form><div class="week-scroll"><div id="week-grid"></div></div>
<div class="week-footer"><button id="this-week">이번 주</button><button id="save-week" class="primary">주간 기록 저장</button></div>
<p id="week-status" role="status" aria-live="polite"></p><button id="retry-week" hidden>다시 불러오기</button>
</div>
<div id="monthly-view" hidden><div class="month-nav"><button id="prev-month" aria-label="이전 달">←</button><h2 id="month-label"></h2><button id="next-month" aria-label="다음 달">→</button></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" aria-label="날짜 선택"></div><p id="month-status" role="status" aria-live="polite"></p><button id="retry-month" hidden>일정 다시 불러오기</button><button id="today" class="today">오늘로 돌아가기</button><p class="hint">날짜: 일일 기록 · +: 일정 추가 · 2개 표시, 나머지는 더보기</p></div>
</aside>
<section class="paper daily"><div class="daily-heading"><div><p class="eyebrow">DAILY PLAN</p><h2 id="day-label">오늘의 기록</h2></div><div class="day-navigation"><button id="prev-day" aria-label="이전 날">‹</button><input id="date" type="date" aria-label="기록 날짜" required><button id="next-day" aria-label="다음 날">›</button></div></div><fieldset id="editor" disabled>
<section class="goals-section"><div class="section-heading"><h3>오늘의 목표</h3><span>오늘 가장 중요하게 생각하는 것</span></div><div class="list-scroll"><div id="goals"></div><button class="add" data-add="goals">+ 목표 추가</button></div></section>
<section class="todos-section"><div class="section-heading"><h3>오늘 할 일</h3><span id="progress">0 / 0 완료</span></div><div class="list-scroll todo-scroll"><div id="todos"></div><div class="todo-add-row"><button class="add-todo" data-add="todos" aria-label="할 일 추가">+</button><span>할 일 추가</span></div></div></section>
<section class="memo-section"><h3><label for="memo">Memo</label></h3><textarea id="memo" maxlength="10000" placeholder="오늘의 생각, 기억하고 싶은 순간을 자유롭게 적어보세요."></textarea></section>
<div class="save-row"><span id="status" role="status" aria-live="polite">불러오는 중…</span><button id="save" class="primary">오늘의 기록 저장</button></div></fieldset><button id="retry" hidden>다시 불러오기</button></section></main><dialog id="month-dialog" aria-labelledby="month-dialog-title">
<form id="month-form"><h2 id="month-dialog-title">일정 편집</h2><p class="hint">하루 최대 5개 · 일정당 20자</p><div id="month-inputs"></div><button type="button" id="add-month-item">+ 일정 추가</button><p id="month-dialog-status" role="status"></p><div class="month-dialog-actions"><button type="button" id="cancel-month">취소</button><button type="submit" id="save-month" class="primary">일정 저장</button></div></form>
</dialog></body></html>
