<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원가입 · 마이플래너</title><link rel="stylesheet" href="/site.css"><script src="/auth.js" defer></script></head>
<body><header class="site-header"><a class="brand" href="/">my planner<span>나의 속도로 채우는 하루</span></a><a class="text-link" href="/">홈으로 돌아가기 ↗</a></header><main class="auth-layout"><section class="auth-story"><p class="eyebrow">YOUR FIRST PAGE</p><h1>나만의 하루를<br>채울 <em>첫 페이지.</em></h1><p>대단한 계획이 아니어도 좋아요.<br>지금의 나에게 필요한 것부터 적어보세요.</p><div class="quote">작은 계획 하나가<br>내일의 나를 바꿀 수도 있으니까.</div><span class="story-bottom">MY PLANNER — MAKE ROOM FOR YOURSELF</span></section><section class="auth-card"><p class="eyebrow">CREATE ACCOUNT</p><h2>회원가입</h2><p class="auth-description">기록을 시작할 나만의 공간을 만들어요.</p><p class="notice error" role="alert" th:if="${error}" th:text="${error}"></p>
<form action="/adduser" method="post" id="signup-form"><label for="username">아이디</label><input id="username" name="username" th:value="${form.username}" autocomplete="username" minlength="4" maxlength="20" pattern="[a-zA-Z0-9_]{4,20}" aria-describedby="username-hint" placeholder="영문, 숫자, 밑줄 4~20자" required><small id="username-hint">로그인할 때 사용할 아이디예요.</small>
<label for="name">닉네임</label><input id="name" name="name" th:value="${form.name}" autocomplete="nickname" minlength="2" maxlength="20" placeholder="나를 부를 이름, 2~20자" required>
<label for="email">이메일</label><input id="email" name="email" th:value="${form.email}" type="email" autocomplete="email" maxlength="254" placeholder="hello@example.com" required>
<label for="password">비밀번호</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="8자 이상 입력해 주세요" required><button type="button" data-toggle="password" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div>
<label for="passwordConfirm">비밀번호 확인</label><div class="password-field"><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="비밀번호를 한 번 더 입력해 주세요" required><button type="button" data-toggle="passwordConfirm" aria-label="비밀번호 확인 표시" aria-pressed="false">보기</button></div><button class="button submit" type="submit">나의 첫 페이지 만들기 →</button></form><p class="auth-switch">이미 계정이 있나요? <a href="/login">로그인</a></p></section></main><footer>my planner <span>오늘도 나의 속도로.</span></footer></body></html>
